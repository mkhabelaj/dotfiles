- name: npm (cwd)
  next:
    name: npm (cwd)
    options:
    - name: scripts
      next:
        name: scripts
        options:
        - name: 'run '
          next:
            name: Script
            capture:
              command: ' jq -r ''.scripts | keys[]'' package.json'
              key: script
            next:
              name: Script
              options:
              - name: run
                description: npm run selected script
                run: npm run {script}
    - name: list scripts
      description: npm list package.json scripts (jq)
      run: jq -r '.scripts | to_entries[] | "\(.key) = \(.value)"' package.json
- name: vd (VisiData)
  next:
    name: vd (VisiData)
    description: Source
    options:
    - name: here (cwd)
      next:
        name: Depth
        capture:
          input: true
          key: depth
          placeholder: max depth
          default: '1'
          validate: \d+
        next:
          name: File
          capture:
            command: find . -maxdepth {depth} -mindepth 1 -type f \( -iname '*.csv' -o -iname '*.tsv' -o -iname '*.json' -o -iname '*.parquet' -o -iname '*.xlsx' \) 2>/dev/null | awk -F/ '{print $NF"\t"$0}' | sort
            key: file
          next:
            name: File
            options:
            - name: open
              description: vd open data file from current dir
              run: vd {file}
    - name: path (search)
      next:
        name: Search_path
        capture:
          input: true
          key: search_path
          placeholder: search path (e.g. ~ or ~/data)
          default: '~'
        next:
          name: Depth
          capture:
            input: true
            key: depth
            placeholder: max depth
            default: '2'
            validate: \d+
          next:
            name: File
            capture:
              command: find "$(eval echo {search_path})" -maxdepth {depth} -mindepth 1 -type f \( -iname '*.csv' -o -iname '*.tsv' -o -iname '*.json' -o -iname '*.parquet' -o -iname '*.xlsx' \) 2>/dev/null | awk -F/ '{print $NF"\t"$0}' | sort
              key: file
            next:
              name: File
              options:
              - name: open
                description: vd open data file from search path
                run: vd {file}
- name: herdr
  next:
    name: herdr
    options:
    - name: new session
      next:
        name: Name
        capture:
          input: true
          key: name
          placeholder: session name
        next:
          name: Name
          options:
          - name: create
            description: herdr create new session
            run: herdr --session {name}
    - name: sessions
      next:
        name: Session
        capture:
          command: herdr session list --json | jq -r '.sessions[] | "\(.name)  (\(if .running then "running" else "stopped" end))\t\(.name)"'
          key: session
        next:
          name: Session
          options:
          - name: attach
            description: herdr attach to session
            run: herdr session attach {session}
          - name: workspaces
            next:
              name: workspaces
              options:
              - name: new workspace
                next:
                  name: Label
                  capture:
                    input: true
                    key: label
                    placeholder: workspace label
                  next:
                    name: Label
                    options:
                    - name: here (current dir)
                      description: herdr new workspace in current dir
                      run: herdr --session {session} workspace create --label "{label}" --cwd "$PWD" --focus
                    - name: search
                      next:
                        name: Search_path
                        capture:
                          input: true
                          key: search_path
                          placeholder: search path (e.g. ~ or ~/dev)
                          default: '~'
                        next:
                          name: Depth
                          capture:
                            input: true
                            key: depth
                            placeholder: max depth
                            default: '1'
                            validate: \d+
                          next:
                            name: Dir
                            capture:
                              command: find "$(eval echo {search_path})" -maxdepth {depth} -mindepth 1 -type d 2>/dev/null | awk -F/ '{print $NF"\t"$0}' | sort
                              key: dir
                            next:
                              name: Dir
                              options:
                              - name: create
                                description: herdr new workspace in chosen dir
                                run: herdr --session {session} workspace create --label "{label}" --cwd {dir} --focus
              - name: open
                next:
                  name: Ws
                  capture:
                    command: "herdr --session {session} workspace list | jq -r '.result.workspaces[] | \"[\\(.number)] \\(.label)  \u2014 \\(.agent_status)\\t\\(.workspace_id)\"'"
                    key: ws
                  next:
                    name: Ws
                    options:
                    - name: jump (focus)
                      description: herdr focus workspace (jump)
                      run: herdr --session {session} workspace focus {ws}
                    - name: rename
                      next:
                        name: Label
                        capture:
                          input: true
                          key: label
                          placeholder: new workspace label
                        next:
                          name: Label
                          options:
                          - name: rename
                            description: herdr rename workspace
                            run: herdr --session {session} workspace rename {ws} "{label}"
                    - name: delete
                      description: herdr close workspace
                      run: herdr --session {session} workspace close {ws}
          - name: stop
            description: herdr stop session
            run: herdr session stop {session}
          - name: delete
            description: herdr delete session
            run: herdr session delete {session}

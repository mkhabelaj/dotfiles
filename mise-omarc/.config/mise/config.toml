[tools]
# Tools already provided by the system (pacman/omarchy) are commented out
# below rather than removed, so it's clear mise intentionally skips them.
# "cargo:tree-sitter-cli" = "latest" # system package
"cargo:harper-ls" = "latest"
claude = "latest"
codex = "latest"
gh = "latest"
"github:agavra/tuicr" = "latest"
# "github:ogulcancelik/herdr" = "latest" # system package
go = "latest"
"go:github.com/joshmedeski/sesh/v2" = "latest"
# gum = "latest" # system package
# lazygit = "latest" # system package
# neovim = "latest" # system package
node = "26.8.2"
"pipx:black" = "25.1.0"
# ripgrep = "latest" # system package
rust = "latest"
# tmux = "latest" # system package
# usage = "latest" # system package
uv = "latest"
yazi = "latest"
# zoxide = "latest" # system package
"github:mkhabelaj/flo-releases" = { version = "latest", bin = "flo" }
# jq = "latest" # system package
"pipx:visidata" = "latest"
# fzf = "latest" # system package
"github:mkhabelaj/hub" = "0.4.1"

# Omarchy sets this globally so `mise up` never prunes the install dir a
# running AI-tool wrapper is executing from.
[settings.upgrade]
auto_prune = false
